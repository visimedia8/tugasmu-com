name = "tugasmu-frontend"
main = ".open-next/worker.js"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
NEXT_PUBLIC_API_URL = "https://tugasmu-api.johananggo.workers.dev"



[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[rules]]
type = "ESModule"
globs = ["**/*.mjs"]
fallthrough = true

